spring.application.name=MediNote
server.port=${PORT:8081}
server.address=0.0.0.0

# ===== PostgreSQL (Neon Cloud) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vital?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
# none = Hibernate does NOT scan the full database on startup.
# The vital DB has CRM tables with missing InnoDB files (error 1932) that crash the scan.
# The users table is created separately via schema.sql if missing.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Run schema.sql on every startup to ensure users table exists
spring.sql.init.mode=always
# ===== MAIL CONFIG =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

app.mail.from=${MAIL_FROM:${spring.mail.username}}
app.reset.base-url=${APP_RESET_BASE_URL:http://localhost:8081/reset-password?token=}


# ===== JWT =====
app.jwt.secret=${JWT_SECRET:change-me-development-secret-change-before-prod-1234567890}
app.jwt.expiration-minutes=15

# ===== MinIO =====
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:medinote}

# ===== Optional local seed users =====
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.staff.email=${APP_SEED_STAFF_EMAIL:}
app.seed.staff.password=${APP_SEED_STAFF_PASSWORD:}

# ===== Eureka =====
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

# ===== Debug =====
logging.level.org.springframework.security=DEBUG
